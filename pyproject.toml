[build-system]
requires = ["setuptools>61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "juno"
version = "0.1.0"
description = "A Houdini-centric VFX/animation pipeline"
requires-python = ">=3.13"
dependencies = [
    "jsonschema",
    "PySide6",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["python"]