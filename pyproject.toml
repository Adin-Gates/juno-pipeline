[build-system]
requires = ["setuptools>61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "juno"
version = "0.1.0"
description = "A Houdini-centric VFX/animation pipeline"
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "referencing",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
gui = [
    "PySide6",
]

[tool.setuptools.packages.find]
where = ["python"]


[tool.pytest.ini_options]
testpaths = ["tests"]
